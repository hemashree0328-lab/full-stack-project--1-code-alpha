<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - My E-Commerce Store</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        /* Header */
        header {
            background: #1f6f43;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        /* Main container */
        .container {
            width: 90%;
            max-width: 450px;
            margin: 50px auto;
        }

        /* Login box */
        .form-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.15);
        }

        .form-box h2 {
            text-align: center;
            color: #1f6f43;
            margin-bottom: 25px;
        }

        /* Labels */
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        /* Input fields */
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1f6f43;
        }

        /* Error message */
        .error {
            background: #ffe5e5;
            color: #d00000;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        /* Login button */
        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #1f6f43;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #155331;
        }

        /* Register link */
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .register-link a {
            color: #1f6f43;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Mobile responsive */
        @media (max-width: 500px) {

            .container {
                margin: 30px auto;
            }

            .form-box {
                padding: 25px;
            }

            header h1 {
                font-size: 22px;
            }
        }

    </style>

</head>

<body>

    <!-- Header -->
    <header>
        <h1>🛒 My E-Commerce Store</h1>
    </header>


    <!-- Login Section -->
    <div class="container">

        <div class="form-box">

            <h2>Welcome Back 👋</h2>


            <!-- Error Message -->
            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <!-- Login Form -->
            <form method="POST">

                {% csrf_token %}


                <!-- Username -->
                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >


                <!-- Password -->
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- Login Button -->
                <button type="submit">
                    Login
                </button>

            </form>


            <!-- Register Link -->
            <div class="register-link">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Create Account
                </a>

            </div>

        </div>

    </div>

</body>

</html>
